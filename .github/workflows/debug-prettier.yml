name: debug-prettier
on:
  push:
    branches:
      - codex/phase-0-1-closeout-hardening
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/server/services/propertyService.test.ts src/server/services/roomService.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet -- src/server/services/propertyService.test.ts src/server/services/roomService.test.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/services/propertyService.test.ts src/server/services/roomService.test.ts
          git commit -m "fix: apply prettier formatting to service tests"
          git push
