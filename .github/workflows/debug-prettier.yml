name: debug-prettier
on:
  pull_request:
    types: [synchronize]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/server/services/propertyService.test.ts src/server/services/roomService.test.ts
      - run: git diff -- src/server/services/propertyService.test.ts src/server/services/roomService.test.ts
