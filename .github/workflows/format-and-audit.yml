name: Step 2 formatting

on:
  push:
    branches:
      - step2-gap-closure-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Step 2 branch
        uses: actions/checkout@v4
        with:
          ref: step2-gap-closure-implementation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format repository with locked Prettier
        run: npx --no-install prettier --write .

      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "chore: format Step 2 gap-closure changes"
          git push origin HEAD:step2-gap-closure-implementation
