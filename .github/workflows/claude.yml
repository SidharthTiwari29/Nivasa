name: Claude Bedrock Code Assistant
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write      # Required for requesting the AWS OIDC JWT
  contents: write      # Required for Claude to see code and make edits
  pull-requests: write # Required for posting comments on PRs
  issues: write

jobs:
  claude_assistant:
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Installs Node without validating project dependencies
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109674077404:role/GitHubClaudeBedrockRole
          aws-region: us-east-1

      - name: Invoke Claude Code Action via Bedrock
        uses: anthropics/claude-code-action@v2
        with:
          use_bedrock: "true"
          trigger_phrase: "@claude"
