name: Auto format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/cinematic/CinematicLandingFinal.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git add src/components/cinematic/CinematicLandingFinal.tsx
          git commit -m "style: apply prettier formatting"
          git push
      - name: Remove helper workflow
        if: always()
        run: |
          rm -f .github/workflows/auto-format.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: remove formatting helper"
          git push
