name: Format target
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/server/repositories/procurementRepository.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet -- src/server/repositories/procurementRepository.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/repositories/procurementRepository.ts
          git commit -m "style: format procurement repository"
          git push origin HEAD:main
