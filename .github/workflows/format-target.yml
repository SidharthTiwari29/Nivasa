name: Format target
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Prettier output
        run: npx prettier src/server/repositories/procurementRepository.ts > /tmp/procurementRepository.ts
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-procurement-repository
          path: /tmp/procurementRepository.ts
