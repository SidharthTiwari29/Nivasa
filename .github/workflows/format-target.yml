name: Format target
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Prettier diff
        run: |
          npx prettier --write src/server/repositories/procurementRepository.ts
          git diff -- src/server/repositories/procurementRepository.ts
