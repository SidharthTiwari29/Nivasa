name: Phase 1 Integration

on:
  push:
    branches:
      - codex/phase1-complete-integration-20260829

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase1-complete-integration-20260829
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate latest main
        run: |
          git fetch origin main step2-gap-closure-implementation
          git merge --no-edit -X ours origin/main
          git merge --no-edit -X ours origin/step2-gap-closure-implementation

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Prisma validate
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Push verified integration
        run: git push origin HEAD:codex/phase1-complete-integration-20260829
