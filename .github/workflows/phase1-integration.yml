name: Phase 1 Integration

on:
  push:
    branches:
      - codex/phase1-complete-integration-20260829

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase1-complete-integration-20260829
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate latest main
        run: |
          git fetch origin main step2-gap-closure-implementation
          git merge --no-edit -X ours origin/main
          git merge --no-edit -X ours origin/step2-gap-closure-implementation

      - name: Remove invalid catalogue identity relation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("prisma/schema.prisma")
          text = path.read_text()
          invalid = "  identities  CatalogueItemIdentity[]\n"
          if invalid in text:
              path.write_text(text.replace(invalid, ""))
              print("Removed invalid CatalogueItemIdentity relation")
          else:
              print("No invalid CatalogueItemIdentity relation present")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Prisma validate
        run: npx prisma validate

      - name: Build
        run: npm run build

      - name: Push verified integration
        run: |
          git add prisma/schema.prisma
          git diff --cached --quiet || git commit -m "fix(phase1): reconcile catalogue schema during integration"
          git push origin HEAD:codex/phase1-complete-integration-20260829
