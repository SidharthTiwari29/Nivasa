name: Phase 1 Integration

on:
  push:
    branches:
      - codex/phase1-complete-integration-20260829

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase1-complete-integration-20260829
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate latest main and Step 2
        run: |
          git fetch origin main step2-gap-closure-implementation
          git merge --no-edit -X ours origin/main
          git merge --no-edit -X ours origin/step2-gap-closure-implementation

      - name: Reconcile Step 2 Prisma schema
        run: |
          git checkout origin/step2-gap-closure-implementation -- prisma/schema.prisma

      - name: Fix required Payment id for Prisma 7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/server/payments/purchaseService.ts")
          text = path.read_text()
          text = text.replace(
              'import { prisma } from "@/server/db/prisma";',
              'import { randomUUID } from "node:crypto";\nimport { prisma } from "@/server/db/prisma";',
          )
          text = text.replace(
              'create: { amountMinor: pkg.priceMinor, currency: pkg.currency },',
              'create: {\n          id: randomUUID(),\n          amountMinor: pkg.priceMinor,\n          currency: pkg.currency,\n        },',
          )
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Normalize formatting
        run: npx prettier --write .

      - name: Prisma generate
        run: npx prisma generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Prisma validate
        run: npx prisma validate

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nivasa
          AUTH_SECRET: phase1-ci-build-secret-012345678901234567890123
        run: npm run build

      - name: Push verified integration
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "fix(phase1): reconcile integrated schema and typecheck blockers"
          git push origin HEAD:codex/phase1-complete-integration-20260829
