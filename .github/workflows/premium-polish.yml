name: Premium polish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium navigation and visual treatment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/cinematic/CinematicLandingFinal.tsx')
          text = path.read_text()

          text = text.replace('  ArrowDown,\n', '')

          old_links = '''  const links = [
    ["The experience", "#walkthrough"],
    ["The idea", "#idea"],
    ["Why Niwasthan", "#why-niwasthan"],
    ["The promise", "#promise"],
    ["How it works", "#process"],
    ["FAQ", "#faq"],
  ];'''
          new_links = '''  const links = [
    ["Experience", "#walkthrough"],
    ["How it works", "#process"],
    ["FAQ", "#faq"],
    ["Contact", "mailto:support@niwasthan.com"],
  ];'''
          if old_links not in text:
              raise SystemExit('navigation links block not found')
          text = text.replace(old_links, new_links)

          old_header = '''        <div className="mx-auto flex max-w-[1440px] items-center justify-between rounded-full border border-white/15 bg-black/25 px-4 py-3 shadow-2xl shadow-black/20 backdrop-blur-xl md:px-5">'''
          new_header = '''        <div className="mx-auto flex max-w-[1440px] items-center justify-between border-b border-white/10 px-0 py-4 md:py-5">'''
          if old_header not in text:
              raise SystemExit('header shell not found')
          text = text.replace(old_header, new_header)

          old_logo = '''            className="font-display text-xl tracking-[-0.03em] text-white md:text-2xl"'''
          new_logo = '''            className="font-display text-2xl font-semibold tracking-[-0.045em] text-[#f1d29a] md:text-3xl"'''
          if old_logo not in text:
              raise SystemExit('logo class not found')
          text = text.replace(old_logo, new_logo, 1)

          old_menu = '''            className="grid h-10 w-10 place-items-center rounded-full border border-[#d6b477]/35 bg-[#d6b477]/10 text-[#f1d29a] transition-colors hover:bg-[#d6b477]/20"'''
          new_menu = '''            className="grid h-11 w-11 place-items-center border border-[#d6b477]/35 bg-black/20 text-[#f1d29a] transition-colors hover:bg-[#d6b477]/10"'''
          if old_menu not in text:
              raise SystemExit('menu class not found')
          text = text.replace(old_menu, new_menu, 1)

          old_nav_class = '''className="flex items-baseline gap-4 border-b border-[#d6b477]/15 pb-4 font-display text-3xl tracking-[-0.03em] text-white sm:text-4xl"'''
          new_nav_class = '''className="group flex items-baseline gap-5 border-b border-white/10 pb-5 font-display text-4xl font-medium tracking-[-0.035em] text-white transition-colors hover:text-[#d6b477] sm:text-5xl"'''
          if old_nav_class not in text:
              raise SystemExit('overlay nav class not found')
          text = text.replace(old_nav_class, new_nav_class)

          # Remove the duplicate NIWASTHAN micro-label from the hero. The premium wordmark remains in the fixed header.
          duplicate_label = '''          <p className="font-mono text-[10px] uppercase tracking-[0.32em] text-[#d6b477]">
            NIWASTHAN
          </p>
'''
          if duplicate_label not in text:
              raise SystemExit('duplicate hero wordmark not found')
          text = text.replace(duplicate_label, '', 1)

          # Replace the connected-but-generic 01-04 cards with image-led editorial panels.
          start = text.find('function WhyNiwasthan()')
          if start == -1:
              raise SystemExit('WhyNiwasthan function not found')
          end_candidates = [
              text.find('function PromiseSection()', start),
              text.find('function Promise()', start),
              text.find('function Process()', start),
          ]
          ends = [x for x in end_candidates if x != -1]
          if not ends:
              raise SystemExit('end of WhyNiwasthan function not found')
          end = min(ends)

          replacement = '''function WhyNiwasthan() {
  const visualPillars = pillars.map((pillar, index) => ({
    ...pillar,
    image: rooms[index + 1].image,
    room: rooms[index + 1].name,
  }));

  return (
    <section id="why-niwasthan" className="bg-[#0b0b0a] px-5 py-32 text-[#f4efe6] md:px-10 md:py-44">
      <div className="mx-auto max-w-[1440px]">
        <div className="max-w-5xl">
          <p className="font-mono text-[10px] uppercase tracking-[0.3em] text-[#d6b477]">Why Niwasthan</p>
          <h2 className="mt-5 max-w-4xl font-display text-[clamp(4rem,8vw,8rem)] font-semibold leading-[0.84] tracking-[-0.055em] text-[#f6f0e5]">
            Clarity looks
            <br />
            <span className="text-[#d6b477]">good on you.</span>
          </h2>
        </div>

        <div className="mt-20 grid gap-px overflow-hidden border border-white/10 bg-white/10 md:grid-cols-2">
          {visualPillars.map(([number, title, copy], index) => {
            const item = visualPillars[index];
            return (
              <article key={number} className="group relative min-h-[440px] overflow-hidden bg-[#11110f]">
                <Image
                  src={item.image}
                  alt={`${item.room} interior`}
                  fill
                  sizes="(min-width: 768px) 50vw, 100vw"
                  className="object-cover transition-transform duration-1000 ease-out group-hover:scale-[1.04]"
                />
                <div className="absolute inset-0 bg-gradient-to-t from-black via-black/55 to-black/5" />
                <div className="absolute inset-0 bg-gradient-to-br from-black/10 via-transparent to-[#d6b477]/10" />
                <div className="relative flex min-h-[440px] flex-col justify-between p-7 md:p-9">
                  <div className="flex items-start justify-between">
                    <span className="font-mono text-sm tracking-[0.2em] text-[#f1d29a]">{number}</span>
                    <span className="border border-white/15 bg-black/25 px-3 py-1.5 font-mono text-[9px] uppercase tracking-[0.18em] text-white/55 backdrop-blur-md">
                      {item.room}
                    </span>
                  </div>
                  <div className="max-w-xl">
                    <h3 className="font-display text-4xl font-semibold leading-[0.92] tracking-[-0.04em] text-white md:text-5xl">
                      {title}
                    </h3>
                    <p className="mt-5 max-w-lg font-body text-sm leading-relaxed text-white/65 md:text-base">
                      {copy}
                    </p>
                  </div>
                </div>
              </article>
            );
          })}
        </div>
      </div>
    </section>
  );
}

'''
          text = text[:start] + replacement + text[end:]

          # Make the final closing CTA feel like part of the dark architectural canvas instead of a separate color world.
          text = text.replace('bg-[#d6b477] px-5 py-24', 'bg-[#0b0b0a] px-5 py-24')
          text = text.replace('text-[#151310] transition-transform', 'text-[#151310] transition-transform')

          path.write_text(text)
          PY

          npx prettier --write src/components/cinematic/CinematicLandingFinal.tsx
          npm run typecheck
          npm run format:check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cinematic/CinematicLandingFinal.tsx
          git diff --cached --quiet || git commit -m "Polish cinematic brand and image-led value section"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/premium-polish.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Remove temporary premium polish workflow"
          git push || true
