name: Prettier Probe
on:
  push:
    branches:
      - codex/prettier-probe
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/PHASE-1-ARCHITECTURE.md
      - run: cp docs/PHASE-1-ARCHITECTURE.md /tmp/PHASE-1-ARCHITECTURE.md
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: /tmp/PHASE-1-ARCHITECTURE.md
