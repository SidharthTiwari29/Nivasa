name: Add process visuals

on:
  push:
    paths:
      - '.github/workflows/process-visuals.yml'
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace process cards with visual story
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/cinematic/CinematicLandingFinal.tsx')
          text = path.read_text()
          marker = 'From first idea'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Process heading not found')
          starts = list(re.finditer(r'\nfunction ([A-Za-z0-9_]+)\(\) \{', text[:pos]))
          if not starts:
              raise SystemExit('Process function start not found')
          start_match = starts[-1]
          name = start_match.group(1)
          next_match = re.search(r'\nfunction [A-Za-z0-9_]+\(\) \{', text[pos:])
          if not next_match:
              raise SystemExit('Next function boundary not found')
          end = pos + next_match.start()

          replacement = f'''\nfunction {name}() {{
  const visualSteps = [
    {{ image: "/process/tell-us-home.svg", alt: "Homeowner sharing their home, needs and priorities with a designer" }},
    {{ image: "/process/shape-design.svg", alt: "Homeowner and designer shaping a floor plan and material direction together" }},
    {{ image: "/process/understand-cost.svg", alt: "Design materials, products and budget details being reviewed together" }},
    {{ image: "/process/choose-execution.svg", alt: "Approved home design moving into coordinated real-world execution" }},
  ];

  return (
    <section id="process" className="bg-[#0b0b0a] px-5 py-28 text-[#f4efe6] sm:py-36 md:px-10 md:py-44">
      <div className="mx-auto max-w-[1440px]">
        <div className="max-w-5xl">
          <p className="font-mono text-[10px] font-medium uppercase tracking-[0.28em] text-[#d6b477]">How it works</p>
          <h2 className="mt-5 font-display text-[clamp(3.4rem,7vw,7.5rem)] font-semibold leading-[0.88] tracking-[-0.055em] text-[#f6f0e5]">
            From first idea<br />to final detail.
          </h2>
          <p className="mt-8 max-w-2xl font-body text-base font-medium leading-relaxed text-white/65 md:text-lg">
            A simple path from understanding your home to deciding how you want to bring it to life.
          </p>
        </div>

        <div className="mt-20 grid gap-10 md:mt-28 md:grid-cols-2 md:gap-x-8 md:gap-y-20">
          {{processSteps.map(([number, title, copy], index) => (
            <article key={{title}} className="group overflow-hidden rounded-[2rem] border border-white/10 bg-white/[0.025]">
              <div className="relative aspect-[16/10] overflow-hidden bg-[#171512]">
                <Image src={{visualSteps[index].image}} alt={{visualSteps[index].alt}} fill sizes="(max-width: 768px) 100vw, 50vw" className="object-cover transition-transform duration-700 ease-out group-hover:scale-[1.025]" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent" />
                <div className="absolute inset-x-0 bottom-0 p-6 md:p-8">
                  <span className="font-mono text-[10px] font-medium uppercase tracking-[0.22em] text-[#d6b477]">Step {{number}}</span>
                </div>
              </div>
              <div className="p-6 md:p-8 md:pb-9">
                <h3 className="font-display text-3xl font-semibold leading-tight tracking-[-0.035em] text-[#f6f0e5] md:text-4xl">{{title}}</h3>
                <p className="mt-4 max-w-xl font-body text-sm font-medium leading-7 text-white/55 md:text-base">{{copy}}</p>
              </div>
            </article>
          ))}}
        </div>
      </div>
    </section>
  );
}}
'''
          path.write_text(text[:start_match.start()] + replacement + text[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cinematic/CinematicLandingFinal.tsx public/process
          git commit -m "Replace process numbers with visual storytelling" || true
          git push
          git rm .github/workflows/process-visuals.yml
          git commit -m "Remove temporary process visual workflow"
          git push
