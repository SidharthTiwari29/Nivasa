name: Phase 1 schema hotfix
on:
  push:
    branches:
      - codex/phase1-complete-integration-20260829
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dangling CatalogueItemIdentity relation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('prisma/schema.prisma')
          s = p.read_text()
          old = '  identities  CatalogueItemIdentity[]\n'
          if old not in s:
              raise SystemExit('Expected dangling CatalogueItemIdentity relation was not found')
          p.write_text(s.replace(old, '', 1))
          PY
          npx prisma validate
      - name: Commit repaired schema
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma
          git commit -m 'fix(prisma): remove dangling CatalogueItemIdentity relation'
          git push
      - name: Remove temporary hotfix workflow
        run: |
          git rm .github/workflows/phase1-schema-hotfix.yml
          git commit -m 'chore(ci): remove temporary schema hotfix workflow'
          git push
