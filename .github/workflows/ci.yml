name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Phase 0 predates a committed lockfile. Generate it in the same
      # checkout before npm ci.
      - name: Prepare npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - run: npm ci
      - name: Normalize repository formatting
        run: npx prettier --write .
      - name: Commit formatting fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply repository formatting"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma validate
      - run: npm run build
