name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Phase 0 predates a committed lockfile. Generate it in the same
      # checkout before npm ci; never mutate the branch from CI.
      - name: Prepare npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma validate
      - run: npm run build
